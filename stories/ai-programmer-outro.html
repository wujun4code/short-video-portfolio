<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#070712;--text:#F0EFF8;--purple:#7C3AED;--orange:#F97316;--cyan:#06B6D4;--gold:#FBBF24}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text)}
body{display:flex;align-items:center;justify-content:center}
.stage{position:relative;width:min(100vw,56.25vh);height:min(100vh,177.78vw);aspect-ratio:9/16;background:#070712;overflow:hidden}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#controls{position:absolute;left:18px;right:18px;bottom:18px;height:46px;border:1px solid rgba(240,239,248,.14);background:rgba(7,7,18,.72);backdrop-filter:blur(14px);border-radius:999px;display:flex;align-items:center;gap:12px;padding:0 14px;z-index:20;box-shadow:0 16px 44px rgba(0,0,0,.32)}
#playBtn{width:30px;height:30px;border-radius:999px;border:1px solid rgba(240,239,248,.28);background:rgba(240,239,248,.08);color:var(--text);font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center}
#timeLabel{font-size:11px;color:rgba(240,239,248,.58);font-variant-numeric:tabular-nums;min-width:68px}
#progressWrap{flex:1;height:6px;border-radius:999px;background:rgba(240,239,248,.12);cursor:pointer;overflow:hidden}
#progressBar{height:100%;width:0%;border-radius:999px;background:linear-gradient(90deg,var(--purple),var(--cyan),var(--orange),var(--gold))}
@media (max-width:520px){#controls{left:14px;right:14px;bottom:14px}}
</style>

function clamp(v,a=0,b=1){return Math.max(a,Math.min(b,v))}
function easeOut(t){return 1-Math.pow(1-clamp(t),3)}
function easeInOut(t){t=clamp(t);return t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2}
function sceneAlpha(progress,i){const s=scenes[i],t=progress*DURATION;if(t<s.start||t>s.end)return 0;let a=1;if(t<s.start+s.fadeI)a=(t-s.start)/s.fadeI;if(s.fadeO>0&&t>s.end-s.fadeO)a=(s.end-t)/s.fadeO;return clamp(a)}
function sceneProg(progress,i){const s=scenes[i],t=progress*DURATION;return clamp((t-s.start)/(s.end-s.start))}
function fmt(sec){const m=Math.floor(sec/60),s=Math.floor(sec%60);return `${m}:${String(s).padStart(2,'0')}`}
function text(str,x,y,size,weight='700',color=C.text,align='center',alpha=1){ctx.save();ctx.globalAlpha=alpha;ctx.fillStyle=color;ctx.textAlign=align;ctx.textBaseline='middle';ctx.font=`${weight} ${size}px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif`;ctx.fillText(str,x,y);ctx.restore()}
function roundRect(x,y,w,h,r,fill,stroke,alpha=1){ctx.save();ctx.globalAlpha=alpha;ctx.beginPath();ctx.roundRect(x,y,w,h,r);if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1.4;ctx.stroke()}ctx.restore()}
function line(x1,y1,x2,y2,color,alpha=1,width=2){ctx.save();ctx.globalAlpha=alpha;ctx.strokeStyle=color;ctx.lineWidth=width;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();ctx.restore()}
function bg(t){
  ctx.fillStyle=C.bg;ctx.fillRect(0,0,W,H);
  const g=ctx.createRadialGradient(W*.52,H*.25,10,W*.52,H*.25,610);g.addColorStop(0,'rgba(124,58,237,.28)');g.addColorStop(.42,'rgba(6,182,212,.10)');g.addColorStop(1,'rgba(7,7,18,0)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  const g2=ctx.createRadialGradient(W*.32,H*.78,10,W*.32,H*.78,500);g2.addColorStop(0,'rgba(249,115,22,.20)');g2.addColorStop(.55,'rgba(251,191,36,.06)');g2.addColorStop(1,'rgba(7,7,18,0)');ctx.fillStyle=g2;ctx.fillRect(0,0,W,H);
  ctx.save();ctx.globalAlpha=.16;ctx.strokeStyle='rgba(240,239,248,.26)';ctx.lineWidth=1;for(let y=122;y<1110;y+=78){ctx.beginPath();ctx.moveTo(50,y+Math.sin(t*.45+y)*7);ctx.bezierCurveTo(210,y-28,500,y+38,668,y-4);ctx.stroke()}ctx.restore();
  for(let i=0;i<64;i++){const x=(Math.sin(t*.38+i*12.989)*43758.5453%1+1)%1*W;const y=(Math.cos(t*.26+i*78.233)*24634.6345%1+1)%1*H;const pulse=.35+.65*Math.sin(t*.95+i);ctx.fillStyle=`rgba(240,239,248,${.035+.04*pulse})`;ctx.beginPath();ctx.arc(x,y,1.0+(i%5)*.35,0,Math.PI*2);ctx.fill()}
}
function logoMark(x,y,scale,a){ctx.save();ctx.translate(x,y);ctx.scale(scale,scale);ctx.globalAlpha=a;ctx.shadowColor='rgba(124,58,237,.75)';ctx.shadowBlur=26;roundRect(-72,-72,144,144,36,'rgba(124,58,237,.16)','rgba(240,239,248,.22)',1);ctx.shadowBlur=0;roundRect(-50,-50,100,100,28,'rgba(6,182,212,.06)','rgba(6,182,212,.28)',1);line(-34,10,-10,-20,C.cyan,1,8);line(-10,-20,30,24,C.orange,1,8);line(-34,10,30,24,C.purple,1,8);[['-34,10',C.cyan],['-10,-20',C.text],['30,24',C.orange]].forEach(([p,c])=>{const [px,py]=p.split(',').map(Number);ctx.fillStyle=c;ctx.beginPath();ctx.arc(px,py,9,0,Math.PI*2);ctx.fill()});ctx.restore()}
function shimmerText(str,x,y,size,a){ctx.save();ctx.globalAlpha=a;const grad=ctx.createLinearGradient(x-210,y,x+210,y);grad.addColorStop(0,C.text);grad.addColorStop(.42,C.cyan);grad.addColorStop(.66,C.gold);grad.addColorStop(1,C.text);ctx.fillStyle=grad;ctx.textAlign='center';ctx.textBaseline='middle';ctx.font=`900 ${size}px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif`;ctx.shadowColor='rgba(124,58,237,.55)';ctx.shadowBlur=22;ctx.fillText(str,x,y);ctx.restore()}
function pill(str,x,y,w,color,a){roundRect(x-w/2,y-24,w,48,24,'rgba(240,239,248,.055)',color.replace('1)', '.26)'),a);text(str,x,y,21,'700',color,'center',a)}
function drawQR(x,y,size,a){
  ctx.save();ctx.globalAlpha=a;
  roundRect(x-10,y-10,size+20,size+20,30,'rgba(240,239,248,.98)','rgba(240,239,248,.88)',1);
  if(qrImg.complete&&qrImg.naturalWidth>0){
    ctx.imageSmoothingEnabled=false;
    ctx.drawImage(qrImg,x,y,size,size);
  }else{
    ctx.fillStyle='#080812';
    ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='700 20px system-ui';
    ctx.fillText('抖音搜索',x+size/2,y+size/2-16);
    ctx.fillText('神笔码农',x+size/2,y+size/2+18);
  }
  ctx.restore();
}
function drawS1(p,a){
  const ia=a*easeOut(p*1.7);
  logoMark(W/2,300,.96,ia);
  shimmerText('神笔码农',W/2,500,84,a*easeOut((p-.10)*1.7));
  text('AI + 程序员',W/2,592,36,'800',C.cyan,'center',a*easeOut((p-.28)*1.7));
  roundRect(118,676,484,64,32,'rgba(240,239,248,.055)','rgba(240,239,248,.15)',a*easeOut((p-.46)*1.7));
  text('用程序员视角，看懂 AI 时代',W/2,708,25,'650','rgba(240,239,248,.82)','center',a*easeOut((p-.50)*1.7));
}
function drawS2(p,a){
  logoMark(178,218,.64,a*easeOut(p*1.55));
  shimmerText('神笔码农',420,205,58,a*easeOut((p-.04)*1.55));
  text('AI 编程 · 行业新闻 · 实战经验',420,276,23,'700',C.cyan,'center',a*easeOut((p-.14)*1.55));
  drawQR(112,386,240,a*easeOut((p-.20)*1.55));
  roundRect(386,430,220,62,31,'rgba(249,115,22,.15)','rgba(249,115,22,.35)',a*easeOut((p-.26)*1.55));
  text('抖音搜',496,461,24,'800','rgba(240,239,248,.74)','center',a*easeOut((p-.30)*1.55));
  text('神笔码农',496,548,40,'900',C.text,'center',a*easeOut((p-.38)*1.55));
  text('关注我，下期继续拆',W/2,760,29,'800',C.gold,'center',a*easeOut((p-.58)*1.55));
}
function drawFrame(progress){const t=progress*DURATION;bg(t);for(let i=0;i<scenes.length;i++){const a=sceneAlpha(progress,i);if(a<=0)continue;const p=sceneProg(progress,i);if(i===0)drawS1(p,a);if(i===1)drawS2(p,a)} }
function updateUI(){const sec=currentTime*DURATION;timeLabel.textContent=`${fmt(sec)} / ${fmt(DURATION)}`;progressBar.style.width=(currentTime*100).toFixed(2)+'%';playBtn.textContent=playing?'⏸':'▶'}
function loop(ts){if(startTime===null)startTime=ts;if(playing&&!dragging){const elapsed=(ts-startTime)/1000+pauseOffset;currentTime=clamp(elapsed/DURATION);if(currentTime>=1){playing=false;pauseOffset=DURATION;currentTime=1}}drawFrame(currentTime);updateUI();requestAnimationFrame(loop)}
playBtn.addEventListener('click',()=>{if(playing){pauseOffset=currentTime*DURATION;playing=false}else{startTime=performance.now();pauseOffset=currentTime*DURATION;playing=true}});
function seek(clientX){const r=progressWrap.getBoundingClientRect();currentTime=clamp((clientX-r.left)/r.width);pauseOffset=currentTime*DURATION;startTime=performance.now();drawFrame(currentTime);updateUI()}
progressWrap.addEventListener('pointerdown',e=>{dragging=true;seek(e.clientX);progressWrap.setPointerCapture(e.pointerId)});
progressWrap.addEventListener('pointermove',e=>{if(dragging)seek(e.clientX)});
progressWrap.addEventListener('pointerup',e=>{dragging=false;seek(e.clientX)});
window.__outro={duration:()=>DURATION,scenes:()=>scenes,drawFrame,audio:()=>false,aspect:()=> '9:16',account:()=> '神笔码农'};
requestAnimationFrame(loop);
</script>
