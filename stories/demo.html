<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0a;
    color: #fff;
    font-family: 'Segoe UI', sans-serif;
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  canvas { border-radius: 12px; }
  h2 {
    position: absolute;
    top: 40px;
    font-size: 1.2rem;
    opacity: 0.7;
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  .hint {
    position: absolute;
    bottom: 60px;
    font-size: 0.8rem;
    opacity: 0.5;
  }
</style>
</head>
<body>
<h2>Interactive Storyboard</h2>
<canvas id="c" width="360" height="560"></canvas>
<p class="hint">点击画布 · Click to interact</p>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let t = 0, clicked = false, particles = [];

function resize() {
  const vw = window.innerWidth, vh = window.innerHeight;
  const scale = Math.min(vw / 400, vh / 620);
  canvas.style.width = (360 * scale) + 'px';
  canvas.style.height = (560 * scale) + 'px';
}
resize();
window.addEventListener('resize', resize);

class Particle {
  constructor(x, y) {
    this.x = x; this.y = y;
    this.vx = (Math.random() - 0.5) * 6;
    this.vy = (Math.random() - 0.5) * 6 - 2;
    this.life = 1;
    this.hue = Math.random() * 60 + 20;
    this.r = Math.random() * 6 + 2;
  }
  update() {
    this.x += this.vx; this.y += this.vy;
    this.vy += 0.15; this.life -= 0.02;
  }
  draw(ctx) {
    ctx.save();
    ctx.globalAlpha = this.life;
    ctx.fillStyle = `hsl(${this.hue},100%,60%)`;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

canvas.addEventListener('click', e => {
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  const cx = (e.clientX - rect.left) * scaleX;
  const cy = (e.clientY - rect.top) * scaleY;
  for (let i = 0; i < 40; i++) particles.push(new Particle(cx, cy));
  clicked = true;
});

function draw() {
  ctx.clearRect(0, 0, 360, 560);

  // Background gradient
  const bg = ctx.createLinearGradient(0, 0, 0, 560);
  bg.addColorStop(0, `hsl(${220 + Math.sin(t * 0.01) * 20}, 60%, 8%)`);
  bg.addColorStop(1, `hsl(${280 + Math.sin(t * 0.008) * 20}, 60%, 6%)`);
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, 360, 560);

  // Floating orbs
  for (let i = 0; i < 5; i++) {
    const x = 180 + Math.sin(t * 0.02 + i * 1.3) * 120;
    const y = 280 + Math.cos(t * 0.015 + i * 1.1) * 160;
    const r = 30 + Math.sin(t * 0.03 + i) * 10;
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    const hue = (t * 0.5 + i * 72) % 360;
    g.addColorStop(0, `hsla(${hue},100%,70%,0.4)`);
    g.addColorStop(1, `hsla(${hue},100%,50%,0)`);
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
  }

  // Center text
  ctx.save();
  ctx.textAlign = 'center';
  ctx.font = `bold ${28 + Math.sin(t * 0.05) * 3}px 'Segoe UI'`;
  ctx.fillStyle = `hsla(${(t * 0.5) % 360},100%,80%,0.9)`;
  ctx.fillText('STORYBOARD', 180, 260);
  ctx.font = '16px Segoe UI';
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  ctx.fillText(clicked ? '✨ 已触发粒子效果' : '点击任意处触发粒子', 180, 295);
  ctx.restore();

  // Particles
  particles = particles.filter(p => p.life > 0);
  particles.forEach(p => { p.update(); p.draw(ctx); });

  t++;
  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
