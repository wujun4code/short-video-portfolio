<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>课件作品集</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', sans-serif;
    background: #f0f4f8;
    min-height: 100vh;
  }
  header {
    background: linear-gradient(135deg, #e63c3c, #ff8c28);
    color: #fff;
    padding: 32px 40px 24px;
  }
  header h1 { font-size: 28px; margin-bottom: 6px; }
  header p  { opacity: .85; font-size: 15px; }

  .container { max-width: 960px; margin: 0 auto; padding: 32px 20px; }

  .client-section { margin-bottom: 40px; }
  .client-header {
    display: flex; align-items: center; gap: 12px;
    margin-bottom: 16px;
  }
  .client-avatar {
    width: 48px; height: 48px; border-radius: 50%;
    background: linear-gradient(135deg, #e63c3c, #ff8c28);
    color: #fff; font-size: 20px; font-weight: bold;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .client-name { font-size: 20px; font-weight: bold; color: #333; }
  .client-meta { font-size: 13px; color: #888; margin-top: 2px; }

  .project-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 18px;
  }
  .project-card {
    background: #fff;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 2px 12px rgba(0,0,0,.08);
    transition: transform .15s, box-shadow .15s;
    text-decoration: none;
    color: inherit;
    display: block;
  }
  .project-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 8px 24px rgba(0,0,0,.14);
  }
  .card-thumb {
    height: 140px;
    background: linear-gradient(135deg, #ff5252, #ff8c28);
    display: flex; align-items: center; justify-content: center;
    font-size: 52px;
  }
  .card-body { padding: 16px 18px 18px; }
  .card-title { font-size: 16px; font-weight: bold; color: #222; margin-bottom: 6px; }
  .card-desc  { font-size: 13px; color: #777; line-height: 1.5; margin-bottom: 12px; }
  .card-meta  { display: flex; align-items: center; justify-content: space-between; }
  .card-date  { font-size: 12px; color: #aaa; }
  .card-badge {
    background: #fff0e6; color: #ff6b1a;
    font-size: 12px; font-weight: bold;
    padding: 3px 10px; border-radius: 20px;
  }
  .card-badge.html { background: #e8f4ff; color: #2a7de1; }
  .card-badge.video { background: #edfaf1; color: #27ae60; }

  footer {
    text-align: center; padding: 32px 20px;
    font-size: 13px; color: #bbb;
  }
</style>
</head>
<body>

<header>
  <h1>🎨 课件作品集</h1>
  <p>客户专属预览 · 按需交付</p>
</header>

<div class="container" id="app">
  <p style="color:#aaa;text-align:center;padding:40px">加载中…</p>
</div>

<footer>Powered by GitHub Pages · slides.aiechohub.com</footer>

<script>
const EMOJI_MAP = { html: '📋', video: '🎬' };
const BADGE_MAP = { html: 'html', video: 'video' };
const BADGE_LABEL = { html: 'HTML 课件', video: '视频' };

async function load() {
  const res = await fetch('data/clients.json');
  const clients = await res.json();
  const app = document.getElementById('app');
  app.innerHTML = '';

  if (!clients.length) {
    app.innerHTML = '<p style="color:#aaa;text-align:center;padding:40px">暂无内容</p>';
    return;
  }

  clients.forEach(client => {
    const sec = document.createElement('div');
    sec.className = 'client-section';

    const initial = client.name.slice(-1); // 取最后一个字做头像
    sec.innerHTML = `
      <div class="client-header">
        <div class="client-avatar">${initial}</div>
        <div>
          <div class="client-name">${client.name}</div>
          <div class="client-meta">${client.projects.length} 个项目</div>
        </div>
      </div>
      <div class="project-grid" id="grid-${client.id}"></div>
    `;
    app.appendChild(sec);

    const grid = sec.querySelector(`#grid-${client.id}`);
    client.projects.forEach(proj => {
      const card = document.createElement('a');
      card.className = 'project-card';
      card.href = proj.url;
      card.target = '_blank';
      card.innerHTML = `
        <div class="card-thumb">${EMOJI_MAP[proj.type] || '📄'}</div>
        <div class="card-body">
          <div class="card-title">${proj.title}</div>
          <div class="card-desc">${proj.description}</div>
          <div class="card-meta">
            <span class="card-date">${proj.created_at}</span>
            <span class="card-badge ${BADGE_MAP[proj.type]}">${BADGE_LABEL[proj.type] || proj.type}</span>
          </div>
        </div>
      `;
      grid.appendChild(card);
    });
  });
}

load().catch(e => {
  document.getElementById('app').innerHTML =
    `<p style="color:#e00;text-align:center;padding:40px">加载失败: ${e.message}</p>`;
});
</script>
</body>
</html>
