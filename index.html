<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="Personal short video portfolio — swipe to explore">
  <title>Short Video Portfolio</title>

  <!-- Open Graph -->
  <meta property="og:title" content="Short Video Portfolio">
  <meta property="og:description" content="Personal short videos & interactive storyboards">
  <meta property="og:type" content="website">

  <link rel="stylesheet" href="assets/style.css">

  <!-- Inline critical: prevent flash -->
  <style>
    #loading {
      position: fixed; inset: 0;
      background: #000;
      display: flex; align-items: center; justify-content: center;
      z-index: 100;
      transition: opacity 0.4s;
    }
    #loading.fade { opacity: 0; pointer-events: none; }
    #loading svg { animation: pulse 1.2s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
  </style>
</head>
<body>

<!-- Loading screen -->
<div id="loading" aria-hidden="true">
  <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.5">
    <polygon points="5,3 19,12 5,21"/>
  </svg>
</div>

<!-- Global mute button (rendered once, positioned via top overlay clone) -->
<button id="btn-mute" class="btn-mute" aria-label="Toggle mute" style="position:fixed;top:14px;right:16px;z-index:50;">
  <!-- Muted icon -->
  <svg id="icon-muted" viewBox="0 0 24 24" aria-hidden="true">
    <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
  </svg>
  <!-- Unmuted icon -->
  <svg id="icon-unmuted" viewBox="0 0 24 24" aria-hidden="true" style="display:none;">
    <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
  </svg>
</button>

<!-- Feed -->
<div id="feed" role="main" aria-label="Video feed"></div>

<!-- Dot indicator -->
<div id="dot-indicator" role="tablist" aria-label="Video position"></div>

<!-- Swipe hint -->
<div id="swipe-hint" aria-hidden="true">
  <div class="swipe-arrow"></div>
  <span>上滑切换 · Swipe up</span>
</div>

<script src="assets/app.js"></script>
<script>
  // Hide loading screen once first slide is ready
  window.addEventListener('load', () => {
    const loading = document.getElementById('loading');
    setTimeout(() => {
      loading.classList.add('fade');
      setTimeout(() => loading.remove(), 400);
    }, 600);
  });
</script>
</body>
</html>
