function clamp(v,a=0,b=1){return Math.max(a,Math.min(b,v))}
function easeOut(t){return 1-Math.pow(1-clamp(t),3)}
function easeInOut(t){t=clamp(t);return t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2}
function pulse(t){return .5+.5*Math.sin(t)}
function sceneAlpha(progress,i){const s=scenes[i],t=progress*DURATION;if(t<s.start||t>s.end)return 0;let a=1;if(t<s.start+s.fadeI)a=(t-s.start)/s.fadeI;if(s.fadeO>0&&t>s.end-s.fadeO)a=(s.end-t)/s.fadeO;return clamp(a)}

function fmt(sec){const m=Math.floor(sec/60),s=Math.floor(sec%60);return `${m}:${String(s).padStart(2,'0')}`}

function line(x1,y1,x2,y2,color,alpha=1,width=2){ctx.save();ctx.globalAlpha=alpha;ctx.strokeStyle=color;ctx.lineWidth=width;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();ctx.restore()}
function glowCircle(x,y,r,color,alpha=1){ctx.save();ctx.globalAlpha=alpha;const g=ctx.createRadialGradient(x,y,1,x,y,r);g.addColorStop(0,color);g.addColorStop(.38,rgba(color,.15));g.addColorStop(1,'rgba(7,7,18,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();ctx.restore()}

function drawFrame(progress){const t=progress*DURATION;bg(t);for(let i=0;i<scenes.length;i++){const a=sceneAlpha(progress,i);if(a<=0)continue;const p=sceneProg(progress,i);if(i===0)drawS1(p,a,progress);if(i===1)drawS2(p,a,progress);if(i===2)drawS3(p,a,progress);if(i===3)drawS4(p,a,progress);if(i===4)drawS5(p,a,progress);if(i===5)drawS6(p,a,progress);if(i===6)drawS7(p,a,progress);if(i===7)drawS8(p,a,progress);if(i===8)drawS9(p,a,progress);if(i===9)drawS10(p,a,progress);if(i===10)drawS11(p,a,progress)}}
function slideProgress(i){
  const s=scenes[i];
  const safeEnd=s.fadeO>0 ? s.end-s.fadeO-.08 : s.end-.08;
  const t=Math.max(s.start+.01, Math.min(safeEnd, s.start+(s.end-s.start)*.92));
  return clamp(t/DURATION);
}
function renderSlide(i=currentSlide){
  currentSlide=clamp(i,0,scenes.length-1);
  drawFrame(slideProgress(currentSlide));
  document.title=`AI 算力战争｜${currentSlide+1}/${scenes.length} ${scenes[currentSlide].name}`;
}
function nextSlide(){renderSlide(currentSlide+1)}
function prevSlide(){renderSlide(currentSlide-1)}
function firstSlide(){renderSlide(0)}
function lastSlide(){renderSlide(scenes.length-1)}
window.addEventListener('keydown',(e)=>{
  const k=e.key;
  if(['ArrowRight','PageDown',' ','Enter'].includes(k)){e.preventDefault();nextSlide()}
  else if(['ArrowLeft','PageUp','Backspace'].includes(k)){e.preventDefault();prevSlide()}
  else if(k==='Home'){e.preventDefault();firstSlide()}
  else if(k==='End'){e.preventDefault();lastSlide()}
});
canvas.addEventListener('click',(e)=>{
  const r=canvas.getBoundingClientRect();
  if(e.clientX-r.left > r.width/2) nextSlide(); else prevSlide();
});
window.__storyboard={duration:()=>DURATION,scenes:()=>scenes,captions:()=>captions,drawFrame,renderSlide,nextSlide,prevSlide,firstSlide,lastSlide,currentSlide:()=>currentSlide,slideProgress,audio:()=>false,aspect:()=> '9:16',mode:()=> 'keyboard-storyboard',controls:()=>false,title:()=> 'AI 算力战争：马斯克 英伟达 3060'};
window.__fogsight=window.__storyboard;
renderSlide(0);
</script>
