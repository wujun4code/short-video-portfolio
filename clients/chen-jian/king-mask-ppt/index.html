<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>奇特的面具 · 二年级美术课件 v3</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: 'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif;
    background: #1a1a2e;
    display: flex; flex-direction: column; align-items: center;
    min-height: 100vh; padding: 20px;
  }
  .slide {
    width: 100%; max-width: 960px;
    aspect-ratio: 16/9;
    border-radius: 18px; overflow: hidden;
    box-shadow: 0 8px 32px rgba(0,0,0,.55);
    display: none;
  }
  .slide.active { display: block; }
  .slide img { width:100%; height:100%; object-fit:cover; display:block; }
  .nav {
    display:flex; align-items:center; gap:16px;
    margin-bottom:16px; width:100%; max-width:960px;
    justify-content: center;
  }
  .btn {
    background:#e63c3c; color:#fff; border:none;
    border-radius:50px; padding:12px 32px;
    font-size:20px; cursor:pointer; font-family:inherit;
    transition: transform .1s, background .15s;
    box-shadow: 0 4px 12px rgba(0,0,0,.3);
  }
  .btn:hover { background:#c0392b; transform:scale(1.05); }
  .btn:disabled { background:#555; cursor:default; transform:none; }
  .counter { color:#fff; font-size:20px; min-width:90px; text-align:center; }
  .page-label { color:#aaa; font-size:14px; min-width:220px; text-align:center; }
  .thumb-row {
    display:flex; gap:8px; flex-wrap:wrap;
    justify-content:center; margin-top:14px;
    width:100%; max-width:960px;
  }
  .thumb {
    width:76px; height:43px; border-radius:7px; overflow:hidden;
    cursor:pointer; border:3px solid transparent;
    transition: border-color .15s, transform .12s;
  }
  .thumb img { width:100%; height:100%; object-fit:cover; }
  .thumb.cur { border-color:#ffcc00; transform:scale(1.15); }
  .section-tag {
    background:#333; color:#aaa; font-size:11px;
    padding:3px 8px; border-radius:12px;
    margin-bottom:6px; text-align:center;
    max-width:960px; width:100%;
  }
</style>
</head>
<body>

<div style="width:100%;max-width:960px;margin-bottom:10px">
  <div style="color:#fff;font-size:22px;font-weight:bold">
    🎭 奇特的面具 · 二年级美术课件
  </div>
  <div style="color:#aaa;font-size:14px;margin-top:4px">
    严格按教案五个教学环节设计 · 共14页
  </div>
</div>

<div class="nav">
  <button class="btn" id="prev" onclick="go(-1)">◀ 上一页</button>
  <span class="counter" id="counter">1 / 14</span>
  <button class="btn" id="next" onclick="go(1)">下一页 ▶</button>
</div>
<div class="page-label" id="label" style="color:#ffd700;font-size:15px;margin-bottom:8px;width:100%;max-width:960px;text-align:center"></div>

<!-- 14 slides -->
<div class="slide active" data-idx="0"><img src="assets_v3/01_cover.png" alt="封面"></div>
<div class="slide" data-idx="1"><img src="assets_v3/02_goals.png" alt="学习目标"></div>
<div class="slide" data-idx="2"><img src="assets_v3/03_giftbox.png" alt="神秘礼盒导入"></div>
<div class="slide" data-idx="3"><img src="assets_v3/04_nuo.png" alt="傩戏面具欣赏"></div>
<div class="slide" data-idx="4"><img src="assets_v3/05_invite.png" alt="面具王国邀请函"></div>
<div class="slide" data-idx="5"><img src="assets_v3/06_compare.png" alt="对比赏析"></div>
<div class="slide" data-idx="6"><img src="assets_v3/07_secrets.png" alt="魔法密码"></div>
<div class="slide" data-idx="7"><img src="assets_v3/08_materials.png" alt="材料准备"></div>
<div class="slide" data-idx="8"><img src="assets_v3/09_steps.png" alt="撕纸步骤"></div>
<div class="slide" data-idx="9"><img src="assets_v3/10_tips.png" alt="设计秘诀"></div>
<div class="slide" data-idx="10"><img src="assets_v3/11_task.png" alt="课堂实践"></div>
<div class="slide" data-idx="11"><img src="assets_v3/12_show.png" alt="走秀展示"></div>
<div class="slide" data-idx="12"><img src="assets_v3/13_king.png" alt="国王寄语"></div>
<div class="slide" data-idx="13"><img src="assets_v3/14_bye.png" alt="结束"></div>

<div class="thumb-row" id="thumbs"></div>

<script>
const TOTAL = 14;
const LABELS = [
  '封面','学习目标',
  '① 趣味导入：神秘礼盒','① 傩戏面具欣赏',
  '② 情境任务：面具王国邀请函','② 对比赏析：三星堆 vs 真实人脸',
  '② 四个魔法密码','③ 材料准备',
  '③ 撕纸法四步骤','③ 设计小秘诀',
  '④ 课堂实践','⑤ 展示评价：面具走秀',
  '⑤ 国王寄语（情感升华）','结束页',
];
const IMGS = ['01_cover','02_goals','03_giftbox','04_nuo','05_invite',
              '06_compare','07_secrets','08_materials','09_steps','10_tips',
              '11_task','12_show','13_king','14_bye'];

let cur = 0;

// thumbnails
const row = document.getElementById('thumbs');
IMGS.forEach((name,i)=>{
  const d=document.createElement('div');
  d.className='thumb'+(i===0?' cur':'');
  const img=document.createElement('img');
  img.src=`assets_v3/${name}.png`;
  d.appendChild(img);
  d.onclick=(()=>{ const n=i; return ()=>goTo(n); })();
  row.appendChild(d);
});

function getSlides(){ return [...document.querySelectorAll('.slide')]; }

function goTo(n){
  const slides=getSlides();
  slides[cur].classList.remove('active');
  document.querySelectorAll('.thumb')[cur].classList.remove('cur');
  cur=Math.max(0,Math.min(TOTAL-1,n));
  slides[cur].classList.add('active');
  const thumbEl=document.querySelectorAll('.thumb')[cur];
  thumbEl.classList.add('cur');
  thumbEl.scrollIntoView({block:'nearest',inline:'center'});
  document.getElementById('counter').textContent=`${cur+1} / ${TOTAL}`;
  document.getElementById('label').textContent=LABELS[cur];
  document.getElementById('prev').disabled=cur===0;
  document.getElementById('next').disabled=cur===TOTAL-1;
}
function go(d){ goTo(cur+d); }
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key==='ArrowDown') go(1);
  if(e.key==='ArrowLeft' ||e.key==='ArrowUp')   go(-1);
});
goTo(0);
</script>
</body>
</html>
