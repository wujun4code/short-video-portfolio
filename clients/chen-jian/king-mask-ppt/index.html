<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>奇特的面具 · 学生课堂PPT预览</title>
<style>
:root{--scale:1;--shell-w:1280px;--shell-h:720px;--safe-pad:16px;--control-h:66px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#020505;color:#f7efd8;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC","Microsoft YaHei",system-ui,sans-serif}
body{min-height:100vh;min-height:100svh;display:flex;align-items:center;justify-content:center;overscroll-behavior:none;touch-action:manipulation}
body.presenting .viewport{grid-template-rows:minmax(0,1fr);gap:0}
body.presenting .control-host{display:none}
body.presenting .stage{border-radius:0;box-shadow:none}
.viewport{width:100vw;height:100vh;height:100svh;display:grid;grid-template-rows:minmax(0,1fr) auto;place-items:center;padding:var(--safe-pad);gap:10px;overflow:hidden;background:radial-gradient(circle at 50% 18%,rgba(255,215,106,.08),transparent 34%),#020505}
.stage-shell{position:relative;width:var(--shell-w);height:var(--shell-h);max-width:100%;max-height:100%;display:grid;place-items:center;overflow:visible}
.stage{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform:translate(-50%,-50%) scale(var(--scale));transform-origin:center center;background:radial-gradient(circle at 76% 36%,rgba(255,198,84,.2),transparent 34%),radial-gradient(circle at 17% 14%,rgba(57,226,203,.16),transparent 31%),linear-gradient(135deg,#04120f 0%,#071b18 48%,#020404 100%);overflow:hidden;box-shadow:0 0 70px rgba(0,0,0,.78);border-radius:18px;will-change:transform}
.stage:before{content:"";position:absolute;inset:-22%;background:repeating-linear-gradient(115deg,rgba(255,215,106,.075) 0 2px,transparent 2px 76px);transform:rotate(-2deg)}
.grain{position:absolute;inset:0;background-image:radial-gradient(rgba(255,244,210,.14) 1px,transparent 1px);background-size:26px 26px;opacity:.17;mix-blend-mode:screen}.slide{position:absolute;inset:0;padding:56px 72px 88px;opacity:0;transform:scale(1.012);transition:opacity .36s ease,transform .36s ease;pointer-events:none}.slide.active{opacity:1;transform:scale(1);pointer-events:auto}.page{position:absolute;right:62px;top:44px;font-size:15px;letter-spacing:.18em;color:rgba(232,222,194,.56)}.kicker{font-size:17px;letter-spacing:.2em;color:#72e4d4;text-transform:uppercase;font-weight:900}.title{font-family:"Noto Serif CJK SC","Songti SC",serif;font-size:64px;line-height:1.08;font-weight:1000;color:#ffd76a;text-shadow:0 0 28px rgba(242,181,71,.45);margin-top:10px;max-width:960px}.title.big{font-size:108px;letter-spacing:.08em}.subtitle{font-size:27px;line-height:1.46;color:#eee2c1;margin-top:20px;max-width:760px;font-weight:720}.flow{position:absolute;left:72px;right:72px;bottom:28px;height:46px;display:grid;grid-template-columns:repeat(5,1fr);gap:8px;z-index:5}.flow div{border-radius:999px;border:1px solid rgba(255,215,106,.22);background:rgba(2,12,11,.52);display:grid;place-items:center;color:rgba(246,239,217,.55);font-size:16px;font-weight:850}.flow div.on{background:linear-gradient(90deg,rgba(255,215,106,.95),rgba(114,228,212,.9));color:#04100f;box-shadow:0 0 24px rgba(255,215,106,.26)}.mask{position:absolute;right:112px;top:104px;width:410px;height:500px;filter:drop-shadow(0 0 40px rgba(242,181,71,.28))}.mask svg{width:100%;height:100%}.bronze{fill:#123d37;stroke:#ffd76a;stroke-width:7}.gold{fill:#ffd76a}.badge{display:inline-flex;align-items:center;gap:10px;margin-top:22px;padding:13px 20px;border-radius:999px;background:rgba(255,215,106,.16);border:1px solid rgba(255,215,106,.34);font-size:20px;color:#ffe7a1;font-weight:950}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-top:38px;max-width:1120px}.card{min-height:142px;padding:25px;border-radius:24px;background:rgba(8,22,20,.8);border:1px solid rgba(114,228,212,.26);box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 16px 52px rgba(0,0,0,.24)}.card b{display:block;color:#ffd76a;font-size:26px;margin-bottom:12px}.card span{font-size:21px;line-height:1.42;color:#ecdfbd}.split{display:grid;grid-template-columns:1fr 1fr;gap:38px;margin-top:34px}.imagebox{height:370px;border-radius:34px;background:linear-gradient(145deg,rgba(7,20,19,.92),rgba(24,54,49,.78));border:1px solid rgba(255,215,106,.36);position:relative;overflow:hidden;box-shadow:0 22px 70px rgba(0,0,0,.24)}.label{position:absolute;padding:10px 16px;border-radius:999px;background:#ffd76a;color:#06100f;font-size:19px;font-weight:1000;box-shadow:0 8px 26px rgba(0,0,0,.25)}.huge{font-size:108px;line-height:1;font-weight:1000;color:#ff594d;text-shadow:0 0 34px rgba(255,89,77,.4)}.prompt{position:absolute;left:72px;bottom:148px;right:72px;min-height:110px;padding:22px 28px;border-radius:26px;background:rgba(4,17,16,.86);border:1px solid rgba(255,215,106,.28);box-shadow:0 18px 60px rgba(0,0,0,.25)}.slide.steps-slide .prompt{bottom:128px;min-height:82px;padding:16px 24px}.slide.steps-slide .prompt b{font-size:21px;margin-bottom:5px}.slide.steps-slide .prompt span{font-size:22px;line-height:1.25}.slide.steps-slide .flow{bottom:28px}.slide.steps-slide .title{font-size:58px}.slide.steps-slide .subtitle{font-size:24px;line-height:1.32;margin-top:12px}.prompt b{display:block;font-size:24px;color:#72e4d4;margin-bottom:8px}.prompt span{font-size:26px;line-height:1.38;color:#f7efd8;font-weight:850}.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-top:28px;max-width:1120px}.step{height:148px;border-radius:25px;padding:18px 20px;background:rgba(4,17,16,.86);border:1px solid rgba(255,215,106,.32);position:relative;box-shadow:0 18px 54px rgba(0,0,0,.22)}.step:before{content:attr(data-n);position:absolute;top:-22px;left:24px;width:52px;height:52px;border-radius:50%;background:#ffd76a;color:#05100f;display:grid;place-items:center;font-size:25px;font-weight:1000}.step b{display:block;color:#72e4d4;font-size:28px;margin:18px 0 8px}.step span{font-size:18.5px;line-height:1.26;color:#e7dcbf;font-weight:750}.task{font-size:31px;line-height:1.42;color:#f8edcc;font-weight:950;max-width:620px;margin-top:30px}.rubric{position:absolute;right:72px;top:276px;width:500px;display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:0;z-index:4}.rubric div{min-height:106px;padding:18px 20px;border-radius:22px;background:rgba(8,22,20,.82);border:1px solid rgba(255,215,106,.28)}.rubric b{display:block;color:#ffd76a;font-size:22px;margin-bottom:7px}.rubric span{font-size:18px;line-height:1.35;color:#e8dec2}.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:32px;max-width:970px}.work{height:148px;border-radius:24px;border:1px solid rgba(255,215,106,.28);background:radial-gradient(circle at 50% 30%,rgba(255,215,106,.16),transparent 42%),rgba(7,20,19,.8);position:relative}.work:before{content:"";position:absolute;left:50%;top:50%;width:82px;height:98px;transform:translate(-50%,-50%);border-radius:46% 46% 40% 40%;background:#16423c;border:4px solid #ffd76a}.quote{font-size:44px;line-height:1.42;color:#f8edcc;font-weight:950;max-width:980px;margin-top:48px}.invite{position:absolute;right:86px;top:178px;width:455px;padding:32px;border-radius:28px;background:linear-gradient(145deg,#f2d28a,#b77a2d);color:#130b04;box-shadow:0 30px 80px rgba(0,0,0,.35);transform:rotate(-2deg);z-index:2}.invite b{display:block;font-size:36px;margin-bottom:14px}.invite p{font-size:23px;line-height:1.42;font-weight:900}
.control-host{width:min(760px,calc(100vw - var(--safe-pad) * 2));height:var(--control-h);display:flex;align-items:center;justify-content:center;z-index:20}.controls{width:100%;height:58px;background:rgba(0,0,0,.72);border:1px solid rgba(255,215,106,.16);display:flex;align-items:center;gap:14px;padding:0 18px;border-radius:20px;backdrop-filter:blur(10px);box-shadow:0 14px 38px rgba(0,0,0,.28)}button{border:1px solid rgba(255,215,106,.38);background:rgba(255,215,106,.12);color:#ffe7a1;border-radius:999px;height:36px;padding:0 18px;font-weight:900;cursor:pointer;white-space:nowrap}.bar{height:7px;border-radius:99px;flex:1;background:rgba(255,255,255,.13);overflow:hidden;min-width:54px}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#72e4d4,#ffd76a,#ff594d)}.small{font-size:14px;color:rgba(246,239,217,.72);min-width:72px;text-align:right}.mini{font-size:22px;color:rgba(246,239,217,.78);line-height:1.55;margin-top:16px;max-width:820px;font-weight:700}
@media(max-width:700px){:root{--safe-pad:8px;--control-h:58px}.viewport{gap:6px}.control-host{width:calc(100vw - 16px)}.controls{height:52px;border-radius:16px;padding:0 10px;gap:8px}button{height:34px;padding:0 10px;font-size:13px}.small{font-size:12px;min-width:44px}.bar{height:6px;min-width:36px}}
@media(max-width:380px){.controls{gap:6px;padding:0 8px}button{padding:0 8px;font-size:12px}.small{display:none}}
@media(orientation:landscape) and (max-height:520px){:root{--safe-pad:6px;--control-h:48px}.viewport{gap:4px}.controls{height:44px;border-radius:14px;padding:0 10px}.control-host{height:48px}button{height:31px;font-size:12px;padding:0 10px}.small{font-size:12px}}

/* 第13页：走秀页独立布局，避免介绍句式遮挡展示卡片 */
.show-gallery{grid-template-columns:repeat(3,1fr);gap:22px;margin-top:34px;max-width:960px}
.show-gallery .work{height:142px}
.show-prompt{left:112px;right:112px;bottom:120px;min-height:98px;padding:18px 28px;z-index:4}
.show-prompt b{font-size:23px;margin-bottom:6px}
.show-prompt span{font-size:25px;line-height:1.28}
</style>
</head>
<body>
<main class="viewport">
  <div class="stage-shell" id="stageShell"><div class="stage" id="stage"><div class="grain"></div></div></div>
  <div class="control-host" id="controlHost"></div>
</main>
<script>
const flow=['进门','发现','学招','创作','亮相'];
const slides=[
{phase:-1,t:'奇特的',big:'面 具',k:'ART · GRADE 2',sub:'一张面具，\n一个新角色，一段神奇故事。',kind:'cover'},
{phase:-1,t:'今天，我们收到了一份神秘邀请',k:'MISSION START',sub:'面具王国正在寻找新的设计师。\n准备好了吗？',kind:'mission'},
{phase:-1,t:'本节课挑战',k:'TODAY\'S CHALLENGE',sub:'观察面具的奇特造型，\n用夸张和变形设计自己的面具。',kind:'goals'},
{phase:0,t:'神秘礼盒里，藏着什么？',k:'STEP 1 · HOOK',sub:'它可能让一个普通人，\n变成勇士、神兽、国王，或者精灵。',kind:'gift'},
{phase:0,t:'古老的傩戏面具',k:'CULTURE',sub:'看看它的表情、颜色和五官，\n你觉得它像什么角色？',kind:'nuo'},
{phase:1,t:'面具王国邀请函',k:'MISSION',sub:'请你为面具王国，\n创造一位从没见过的新角色。',kind:'invite'},
{phase:1,t:'真实人脸 vs 三星堆面具',k:'COMPARE',sub:'同样是脸，为什么这一张让人一眼忘不了？',kind:'compare'},
{phase:1,t:'奇特的秘密：夸张！',k:'DESIGN CODE',sub:'把普通的五官，\n变得更大、更长、更有力量。',kind:'secrets'},
{phase:2,t:'工具台准备好了',k:'MATERIALS',sub:'纸、彩笔、剪刀、胶棒……\n材料越会组合，角色越有生命。',kind:'materials'},
{phase:2,t:'四步做出面具造型',k:'MAKE IT',sub:'跟着步骤来：\n折、撕、贴、添。',kind:'steps'},
{phase:2,t:'让面具更有“角色感”',k:'DESIGN TIPS',sub:'不只是做一张脸，\n而是设计一个有性格的角色。',kind:'tips'},
{phase:3,t:'开始创作：我的神秘面具',k:'CREATE',sub:'请为你的面具起一个名字，\n让它有外形，也有故事。',kind:'task'},
{phase:4,t:'面具走秀时间',k:'SHOW TIME',sub:'展示你的作品，\n用一句话介绍它的力量。',kind:'show'},
{phase:4,t:'国王的悄悄话',k:'REFLECTION',sub:'真正厉害的面具，\n不是最复杂，而是最有想法。',kind:'king'},
{phase:4,t:'面具王国，下次再见',k:'THE END',sub:'愿你以后看到每一张脸，\n都能发现藏在背后的故事。',kind:'bye'}
];
const stage=document.getElementById('stage');const shell=document.getElementById('stageShell');const controlHost=document.getElementById('controlHost');let idx=0,playing=false,timer=null;
function fitStage(){const root=document.documentElement;const styles=getComputedStyle(root);const presenting=document.body.classList.contains('presenting');const pad=presenting?0:(parseFloat(styles.getPropertyValue('--safe-pad'))||16);const ch=presenting?0:(parseFloat(styles.getPropertyValue('--control-h'))||66);const gap=presenting?0:(window.innerWidth<=700?6:10);const availW=Math.max(120,window.innerWidth-pad*2);const availH=Math.max(90,window.innerHeight-pad*2-ch-gap);const scale=Math.max(0.05,Math.min(availW/1280,availH/720));root.style.setProperty('--scale',scale.toFixed(5));root.style.setProperty('--shell-w',(1280*scale).toFixed(2)+'px');root.style.setProperty('--shell-h',(720*scale).toFixed(2)+'px');}
function maskHTML(style=''){return `<div class="mask" style="${style}"><svg viewBox="0 0 300 360"><path class="bronze" d="M150 25 C85 25 50 78 50 150 C50 245 88 326 150 337 C212 326 250 245 250 150 C250 78 215 25 150 25Z"/><path class="bronze" d="M55 160 L8 195 L60 210"/><path class="bronze" d="M245 160 L292 195 L240 210"/><ellipse class="gold" cx="105" cy="150" rx="45" ry="22"/><ellipse class="gold" cx="195" cy="150" rx="45" ry="22"/><circle cx="105" cy="150" r="10" fill="#04100f"/><circle cx="195" cy="150" r="10" fill="#04100f"/><path d="M150 150 L128 230 L172 230Z" fill="#ffd76a" opacity=".92"/><path d="M94 270 Q150 305 206 270" fill="none" stroke="#ffd76a" stroke-width="12" stroke-linecap="round"/><path d="M92 85 Q150 55 208 85" fill="none" stroke="#72e4d4" stroke-width="8" stroke-linecap="round"/></svg></div>`}
function flowHTML(p){return `<div class="flow">${flow.map((x,i)=>`<div class="${i===p?'on':''}">${i+1}. ${x}</div>`).join('')}</div>`}
function base(s,n){return `<section class="slide active ${s.kind==='steps'?'steps-slide':''}"><div class="page">${String(n+1).padStart(2,'0')} / ${slides.length}</div><div class="kicker">${s.k}</div><h1 class="title ${s.kind==='cover'?'big':''}">${s.kind==='cover'?s.t+'<br>'+s.big:s.t}</h1><div class="subtitle">${s.sub.replace(/\n/g,'<br>')}</div>${s.phase>=0?flowHTML(s.phase):''}</section>`}
function promptBox(label,text){return `<div class="prompt"><b>${label}</b><span>${text}</span></div>`}
function render(){fitStage();const s=slides[idx];let html='<div class="grain"></div>';html+=base(s,idx).replace('</section>',extra(s)+`</section>`);stage.innerHTML=html;controlHost.innerHTML=`<div class="controls"><button onclick="prev()" aria-label="上一页">上一页</button><button onclick="toggle()" id="play" aria-label="播放暂停">${playing?'暂停':'播放'}</button><button onclick="next()" aria-label="下一页">下一页</button><button onclick="present()" aria-label="演示模式">演示</button><div class="bar" onclick="seek(event)" role="slider" aria-valuemin="1" aria-valuemax="${slides.length}" aria-valuenow="${idx+1}"><i style="width:${(idx+1)/slides.length*100}%"></i></div><div class="small">${idx+1} / ${slides.length}</div></div>`;}
function extra(s){
if(s.kind==='cover')return maskHTML()+`<div class="badge">二年级美术 · 神秘博物馆视觉版</div>`;
if(s.kind==='mission')return `<div class="invite"><b>面具王国来信</b><p>亲爱的小设计师：<br>请你创造一张奇特的面具，让它拥有自己的名字和故事。</p></div>${maskHTML('left:118px;top:210px;width:270px;height:330px')}`;
if(s.kind==='goals')return `<div class="cards"><div class="card"><b>看一看</b><span>发现面具哪里奇特</span></div><div class="card"><b>说一说</b><span>用眼睛、鼻子、嘴巴描述变化</span></div><div class="card"><b>学一学</b><span>用夸张和变形设计角色</span></div><div class="card"><b>做一做</b><span>完成一张有故事的面具</span></div></div>`;
if(s.kind==='gift')return `<div style="position:absolute;right:160px;top:205px;width:390px;height:300px;border-radius:32px;background:linear-gradient(145deg,rgba(255,215,106,.22),rgba(7,20,19,.9));border:1px solid rgba(255,215,106,.36);display:grid;place-items:center;font-size:122px;box-shadow:0 28px 80px rgba(0,0,0,.32)">🎁</div>${promptBox('想一想','如果戴上它，你会变成谁？')}`;
if(s.kind==='nuo')return maskHTML()+promptBox('观察任务','它的眼睛、嘴巴、颜色，给你什么感觉？');
if(s.kind==='invite')return `<div class="invite"><b>面具王国邀请函</b><p>任务：设计一位新角色。<br>要求：外形奇特，有名字，有故事。</p></div>${promptBox('今天的任务','不是画一张普通的脸，而是创造一个角色。')}`;
if(s.kind==='compare')return `<div class="split"><div class="imagebox"><div class="label" style="left:48px;top:42px">真实人脸</div><div style="position:absolute;left:170px;top:95px;width:180px;height:225px;border-radius:50%;border:8px solid #e7c9a0;background:rgba(255,220,180,.18)"></div></div><div class="imagebox">${maskHTML('right:60px;top:2px;width:310px;height:360px')}<div class="label" style="right:42px;top:42px">眼睛变长</div><div class="label" style="right:42px;top:130px">鼻子变高</div><div class="label" style="right:42px;top:218px">耳朵变大</div></div></div><div class="huge" style="position:absolute;left:610px;top:490px">夸张！</div>`;
if(s.kind==='secrets')return `<div class="cards"><div class="card"><b>放大</b><span>把最重要的地方变大</span></div><div class="card"><b>拉长</b><span>让五官更有方向</span></div><div class="card"><b>上扬</b><span>让角色更有精神</span></div><div class="card"><b>变形</b><span>让它不再普通</span></div></div>${promptBox('记住这句话','普通脸 + 夸张变化 = 奇特面具')}`;
if(s.kind==='materials')return `<div class="cards"><div class="card"><b>纸</b><span>卡纸 / 硬纸板</span></div><div class="card"><b>画</b><span>彩笔 / 油画棒</span></div><div class="card"><b>剪</b><span>剪刀要注意安全</span></div><div class="card"><b>贴</b><span>胶棒 / 彩纸 / 毛线</span></div></div>${promptBox('材料小提醒','先想角色，再选择材料。')}`;
if(s.kind==='steps')return `<div class="steps"><div class="step" data-n="1"><b>折</b><span>对折找中心，左右大致平衡</span></div><div class="step" data-n="2"><b>撕</b><span>撕出面具外形，形状不必规则</span></div><div class="step" data-n="3"><b>贴</b><span>组合眼睛、鼻子、嘴巴</span></div><div class="step" data-n="4"><b>添</b><span>添加纹样、颜色和装饰</span></div></div>${promptBox('面具小秘诀','先有大外形，再加五官，最后让纹样和颜色说话。')}`;
if(s.kind==='tips')return `<div class="cards"><div class="card"><b>突出一个重点</b><span>眼睛、嘴巴或角，至少一个地方特别</span></div><div class="card"><b>纹样有节奏</b><span>重复、对称、粗细变化</span></div><div class="card"><b>颜色有对比</b><span>深浅、冷暖、明暗形成冲击</span></div><div class="card"><b>故事说得出</b><span>它是谁？来自哪里？有什么力量？</span></div></div>`;
if(s.kind==='task')return `<div class="task">创作要求：<br>① 设计一张奇特面具；<br>② 至少用一种夸张方法；<br>③ 加入纹样和颜色对比；<br>④ 给面具起名字，准备一句介绍。</div><div class="rubric"><div><b>造型</b><span>奇特吗？</span></div><div><b>色彩</b><span>有冲击吗？</span></div><div><b>纹样</b><span>有节奏吗？</span></div><div><b>故事</b><span>说得出来吗？</span></div></div>`;
if(s.kind==='show')return `<div class="gallery show-gallery"><div class="work"></div><div class="work"></div><div class="work"></div></div><div class="prompt show-prompt"><b>介绍句式</b><span>我的面具叫____，它最特别的地方是____。</span></div>`;
if(s.kind==='king')return `<div class="quote">“真正厉害的面具，<br>不是最复杂，<br>而是最有想法。”</div>${maskHTML()}`;

function present(){document.body.classList.toggle('presenting');fitStage()}function seek(e){const r=e.currentTarget.getBoundingClientRect();const pct=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));idx=Math.min(slides.length-1,Math.max(0,Math.floor(pct*slides.length)));render()}function next(){idx=Math.min(slides.length-1,idx+1);if(idx===slides.length-1)stop();render()}function prev(){idx=Math.max(0,idx-1);render()}function toggle(){playing?stop():play()}function play(){playing=true;render();timer=setInterval(()=>{if(idx>=slides.length-1){stop();return}idx++;render()},5200)}function stop(){playing=false;if(timer)clearInterval(timer);timer=null;const b=document.getElementById('play');if(b)b.textContent='播放'}
